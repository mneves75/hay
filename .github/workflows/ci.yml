name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A superseded push should not keep burning runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  hay:
    name: hay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: hay
    steps:
      # Actions are pinned by commit SHA, not by tag: a tag can be moved to point at new code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: hay
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test
      - run: cargo build --release

      # The differential test is the correctness property `hay` lives or dies by: identical
      # matches to ripgrep, only reordered. Three real defects surfaced here and nowhere else.
      # It runs on all three OSes — Windows under Git Bash — because a parity claim that has
      # never executed on a platform is a claim, not a gate.
      - name: Install ripgrep
        shell: bash
        run: |
          command -v rg && exit 0
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ripgrep ;;
            macOS) brew install ripgrep ;;
            Windows) choco install ripgrep -y --no-progress ;;
          esac
      - name: Differential test vs ripgrep
        working-directory: .
        shell: bash
        run: ./hay/differential-test.sh

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          # Keep in sync with `rust-version` in hay/Cargo.toml.
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: hay
      - run: cargo check --all-targets

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped to this job: the action reports advisories as a check run.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: hay

  tools:
    name: measurement kit selftests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      # The benchmark selftest exercises the real rg-based docs-track derivation on a fixture.
      - name: Install ripgrep
        run: command -v rg || (sudo apt-get update && sudo apt-get install -y ripgrep)
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run typecheck
      # Each tool self-checks its pure functions; none of them needs agent transcripts to do it.
      - run: bun grep-hygiene.ts --selftest
      - run: bun harvest-queries.ts --selftest
      - run: bun measure-mrr.ts --selftest
      - run: bun doc-authority.ts --selftest
      - run: bun categorize-misses.ts --selftest
      - run: bun swe-explore.ts --selftest
      - run: bun benchmark.ts --selftest
      - run: bun benchmark-report.ts --selftest
      - run: bun explainer-html.ts --selftest
      - name: Generated reports are current
        run: |
          bun benchmark-report.ts
          bun explainer-html.ts --in BENCHMARK_FEYNMAN.md --out benchmark-feynman.html
          git diff --exit-code -- BENCHMARK.md benchmark.html benchmark-feynman.html
      - run: shellcheck benchmark-corpora.sh hay/differential-test.sh install.sh

  site:
    name: benchmark film source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site/video-src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: site/video-src/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm build
