name: Release

# Tag-triggered binary builds. The final step creates a DRAFT release: publishing is a human
# act, per this repo's rule that a release needs an explicit ask — the workflow only stages it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is arm64; the x86_64 binary executes for its version check under
          # Rosetta 2, which GitHub's arm64 macOS images ship. If GitHub ever drops Rosetta,
          # that job fails loudly at the guard — nothing publishes silently wrong.
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      # Actions pinned by commit SHA, same as ci.yml: a tag can be moved to point at new code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path hay/Cargo.toml

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"                  # e.g. v0.1.3 or v0.1.3-beta1
          bin=hay; [ "$RUNNER_OS" = "Windows" ] && bin=hay.exe
          built="hay/target/${{ matrix.target }}/release/$bin"

          # A release asset with the wrong binary inside is a quiet wrong answer: the version
          # the binary reports must prefix-match the tag (beta suffixes live on the tag only).
          binver="$("$built" --version | awk '{print $2}')"
          case "${tag#v}" in
            "$binver"|"$binver"-*) ;;
            *) echo "tag $tag does not match binary version $binver" >&2; exit 1 ;;
          esac

          name="hay-${tag}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "$built" LICENSE README.md CHANGELOG.md "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name" >/dev/null
            asset="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          { sha256sum "$asset" 2>/dev/null || shasum -a 256 "$asset"; } > "$asset.sha256"
          rm -r "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  draft-release:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Only a DRAFT may be refreshed. A published release is immutable from here: a moved
            # or re-pushed tag must never silently replace binaries people already downloaded.
            draft="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)"
            if [ "$draft" != "true" ]; then
              echo "release $TAG is already published; refusing to overwrite its assets" >&2
              exit 1
            fi
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "hay ${TAG#v}" --notes "Draft — fill from CHANGELOG.md before publishing." \
              dist/*
          fi
