name: Release

# Manually authorized binary builds from main. This file replaced the tag-triggered
# `.github/workflows/release.yml`, which remains as a DISABLED inert stub: GitHub runs a pushed
# tag's workflow from the tagged commit, so while that identity was active a tag at older history
# ran the old, ungated release. See the stub for why it must never be deleted.
# The maintainer first creates a lightweight v* tag at
# a main commit whose push CI succeeded, then dispatches this workflow FROM main with that tag. The
# workflow is loaded from main, never from the tag, so a tag aimed at older history cannot run an
# older copy of the policy. It builds and attests the dispatch SHA, which the tag must name exactly,
# and creates a DRAFT release. Publishing remains a separate human act.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z or vX.Y.Z-betaN)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every step reads inputs through environment variables written as "$NAME", which only bash expands:
# Windows runners default to PowerShell, where "$TARGET" is an empty PowerShell variable. The
# v0.3.1-beta1 dispatch failed exactly that way ("target was empty") before this default existed.
defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: verify release policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout and fetch main to prove the dispatch SHA is on it
      actions: read # query ci.yml runs for the exact dispatch SHA
    outputs:
      tag: ${{ steps.policy.outputs.tag }}
      sha: ${{ steps.policy.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Require main dispatch, successful push CI, and the tag at this commit
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash ./release-policy.sh verify

  build:
    name: build (${{ matrix.target }})
    needs: verify-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is arm64; the x86_64 binary executes for its version check under
          # Rosetta 2, which GitHub's arm64 macOS images ship. If GitHub ever drops Rosetta,
          # that job fails loudly at the guard — nothing publishes silently wrong.
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      # Actions pinned by commit SHA, same as ci.yml: a tag can be moved to point at new code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify-release.outputs.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" --manifest-path hay/Cargo.toml

      - name: Package
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify-release.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"                         # e.g. v0.1.3 or v0.1.3-beta1
          bin=hay; [ "$RUNNER_OS" = "Windows" ] && bin=hay.exe
          built="hay/target/$TARGET/release/$bin"

          # A release asset with the wrong binary inside is a quiet wrong answer: the version
          # the binary reports must prefix-match the tag (beta suffixes live on the tag only).
          binver="$("$built" --version | awk '{print $2}')"
          case "${tag#v}" in
            "$binver"|"$binver"-*) ;;
            *) echo "tag $tag does not match binary version $binver" >&2; exit 1 ;;
          esac

          name="hay-${tag}-${TARGET}"
          mkdir -p "dist/$name"
          cp "$built" LICENSE README.md CHANGELOG.md "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name" >/dev/null
            asset="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          { sha256sum "$asset" 2>/dev/null || shasum -a 256 "$asset"; } > "$asset.sha256"
          rm -r "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  draft-release:
    name: draft release
    needs: [verify-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can write repository contents. The environment admits deployments from
    # main only, and the job compiles nothing: it attests downloaded archives, re-checks the tag
    # with the policy script from the verified commit, and uploads to a draft.
    environment: release
    permissions:
      contents: write # create or refresh the draft release and upload its assets
      id-token: write # OIDC identity for the Sigstore provenance certificate
      attestations: write # store the build-provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify-release.outputs.sha }}
          sparse-checkout: release-policy.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Verify provenance before creating the draft
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.verify-release.outputs.sha }}
        run: |
          set -euo pipefail
          for asset in dist/*.tar.gz dist/*.zip; do
            gh attestation verify "$asset" -R "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-dispatch.yml" \
              --source-ref refs/heads/main --source-digest "$SOURCE_SHA" \
              --deny-self-hosted-runners >/dev/null
          done
      # The build took minutes; a tag moved in the meantime must not receive these assets.
      - name: Re-check the tag still names the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.verify-release.outputs.sha }}
        run: bash ./release-policy.sh check-tag
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-release.outputs.tag }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Only a DRAFT may be refreshed. A published release is immutable from here: a moved
            # or re-pushed tag must never silently replace binaries people already downloaded.
            draft="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)"
            if [ "$draft" != "true" ]; then
              echo "release $TAG is already published; refusing to overwrite its assets" >&2
              exit 1
            fi
            # --clobber replaces same-named files but keeps every other one, so a draft carrying an
            # asset this run did not build would publish bytes nobody attested. Refuse instead.
            RELEASE_TAG="$TAG" DIST_DIR=dist bash ./release-policy.sh check-draft-assets
            # A refreshed beta draft may predate the prerelease rule below, or have been edited by
            # hand; mark it here too so no path to publishing a beta leaves it eligible for Latest.
            case "$TAG" in
              *-beta*) gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --prerelease ;;
            esac
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
          else
            # A beta is created as a prerelease so publishing it can never make it Latest, which
            # is what the formula's livecheck and install.sh's default resolve.
            prerelease=()
            case "$TAG" in *-beta*) prerelease=(--prerelease) ;; esac
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --verify-tag "${prerelease[@]}" \
              --title "hay ${TAG#v}" --notes "Draft — fill from CHANGELOG.md before publishing." \
              dist/*
          fi
