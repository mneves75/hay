name: Bug report
description: Report incorrect matches, ordering, output, or errors
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, personal data, private repository names, absolute paths, or transcript excerpts. Use **Security → Report a vulnerability** for exploitable issues.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `hay --version`
      placeholder: "hay 0.7.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "macOS 26, Linux, or Windows"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Redacted command
      description: Replace private paths and identifiers with safe placeholders.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal public reproduction
      description: Prefer a small temporary tree over output from a private repository.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private and personal data from this report.
          required: true
