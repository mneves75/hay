name: Feature request
description: Propose a measured addition to `hay`
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Do not include private repository data, personal data, secrets, or transcript excerpts.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What search fails today? Use a public or synthetic example.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include counts or a reproducible case when available.
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful change
    validations:
      required: true
  - type: textarea
    id: ripgrep
    attributes:
      label: Ripgrep compatibility
      description: Explain whether the proposal changes matches, ordering, flags, output, or exit codes.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private and personal data from this request.
          required: true
