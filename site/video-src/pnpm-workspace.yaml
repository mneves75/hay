# Remotion 4.0.515 still pins typescript-eslint 8.21; the current release supports ESLint 10.
overrides:
  typescript-eslint: 8.67.0
  # GHSA-hrr3-gc8f-f4qj and earlier siblings: fast-uri <3.1.8, reached only through
  # Remotion's webpack/ajv bundler chain. Drop once Remotion's lockfile resolves a patched version.
  fast-uri: 3.1.8
  # GHSA-2883-xcg3-v3hh: js-yaml <4.3.2, reached only through Remotion Studio's SVGR loader.
  js-yaml: 4.3.2
  # GHSA-68fv-2mgg-jv7q: force the patched source-map-js while the existing bundler
  # graph retains 1.2.1. Remove when a normal lock refresh resolves a patched version.
  source-map-js: 1.2.2
allowBuilds:
  esbuild: true
